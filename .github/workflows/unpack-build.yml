name: Unpack ZIP and build APK

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the uploaded ZIP
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Using: $ZIP"
          mkdir -p /tmp/unz
          unzip -q -o "$ZIP" -d /tmp/unz
          SRC=$(dirname "$(find /tmp/unz -name settings.gradle | head -n 1)")
          echo "Project folder: $SRC"
          rm -rf app
          rsync -a --exclude '.github' "$SRC"/ ./
          rm -f "$ZIP"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-100-games
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Save the unpacked project in the repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update project from uploaded ZIP" || echo "Nothing to commit"
          git push
