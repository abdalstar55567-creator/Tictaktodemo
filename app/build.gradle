plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Native libraries required by the embedded LibGDX game (Tangler).
configurations {
    gdxNatives
}

android {
    namespace 'com.example.tictactoe'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tictactoe"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            jniLibs.srcDir(layout.buildDirectory.dir('generated/gdxJniLibs'))
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Tangler game engine and rendering dependencies.
    implementation 'com.badlogicgames.gdx:gdx:1.13.1'
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.13.1'
    implementation 'io.github.libktx:ktx-app:1.12.1-rc1'
    implementation 'io.github.libktx:ktx-assets:1.12.1-rc1'
    implementation 'space.earlygrey:shapedrawer:2.6.0'
    implementation 'org.mini2Dx:universal-tween-engine:6.3.3'

    // Bundle native LibGDX libraries for the common Android ABIs.
    gdxNatives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    gdxNatives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'
    gdxNatives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86'
    gdxNatives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86_64'
    gdxNatives 'com.badlogicgames.gdx:gdx-freetype-platform:1.13.1:natives-armeabi-v7a'
    gdxNatives 'com.badlogicgames.gdx:gdx-freetype-platform:1.13.1:natives-arm64-v8a'
    gdxNatives 'com.badlogicgames.gdx:gdx-freetype-platform:1.13.1:natives-x86'
    gdxNatives 'com.badlogicgames.gdx:gdx-freetype-platform:1.13.1:natives-x86_64'

    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Jetpack Compose
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui:1.6.2'
    implementation 'androidx.compose.ui:ui-graphics:1.6.2'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.6.2'
    implementation 'androidx.compose.material3:material3:1.2.1'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.6.2'
}


// Extract each LibGDX native artifact into the ABI directory encoded in
// its Maven classifier (the .so files inside these jars are at the jar root).
tasks.register('extractGdxNatives') {
    def nativeOutputDir = layout.buildDirectory.dir('generated/gdxJniLibs')
    outputs.dir(nativeOutputDir)

    doLast {
        def outputDir = nativeOutputDir.get().asFile
        delete(outputDir)
        outputDir.mkdirs()

        def abiByClassifier = [
            'natives-armeabi-v7a.jar': 'armeabi-v7a',
            'natives-arm64-v8a.jar': 'arm64-v8a',
            'natives-x86.jar': 'x86',
            'natives-x86_64.jar': 'x86_64'
        ]

        configurations.gdxNatives.files.each { nativeJar ->
            def abi = abiByClassifier.find { suffix, value -> nativeJar.name.endsWith(suffix) }?.value
            if (abi != null) {
                copy {
                    from(zipTree(nativeJar))
                    include '**/*.so'
                    eachFile { details -> details.path = details.name }
                    includeEmptyDirs = false
                    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
                    into(new File(outputDir, abi))
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('extractGdxNatives')
}
